name: Build Windows installer
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Tạo bản phát hành (Release) với thẻ này, ví dụ v1.0.0; để trống thì chỉ dựng và tải artifact'
        required: false
        default: ''
  push:
    tags: ['v*']
permissions:
  contents: write   # chỉ dùng để tạo Release khi gắn thẻ v* hoặc chạy tay có release_tag; các lượt PR không dùng
concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  # Commit được kiểm thử và đóng gói. Với pull_request, github.sha là commit ghép tạm nên dùng đúng commit đầu nhánh.
  TESTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
jobs:
  quality:
    name: Kiểm tra chất lượng mã (hak_code_quality_test)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAKQ_SHA: b78d9b2f30d63f29f59c5ade94e6d968ae4805d4   # ghim đúng commit của công cụ; đổi có chủ đích khi nâng cấp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: { node-version: 22 }
      - name: Tải công cụ kiểm tra (chỉ đọc, chạy offline)
        run: |
          mkdir ../hakq && cd ../hakq && git init -q && git remote add origin https://github.com/saoluucvhak-pixel/hak_code_quality_test
          git fetch -q --depth 1 origin "$HAKQ_SHA" && git checkout -q FETCH_HEAD && npm ci --silent
      - name: Quét mã (chặn khi có lỗi mức error theo .hakquality.json)
        run: node ../hakq/bin/hak-quality.js . --out reports
      - name: Kiểm tra lỗ hổng thư viện (npm audit) — chặn khi thư viện chạy trong ứng dụng có lỗ hổng mức cao trở lên
        run: |
          mkdir -p reports
          npm audit --json > reports/npm-audit-all.json || true                     # toàn bộ (kể cả công cụ build/kiểm thử): chỉ báo cáo
          npm audit --omit=dev --json > reports/npm-audit-prod.json || true
          npm audit --audit-level=moderate || echo "::warning::Có lỗ hổng trong thư viện dùng để build/kiểm thử (không đóng gói vào ứng dụng); xem reports/npm-audit-all.json"
          npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: quality-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports
          if-no-files-found: error
  e2e-pdf:
    name: Kiểm thử bố cục biểu mẫu Word qua PDF (LibreOffice, Ubuntu)
    # Các bộ e2e dựng .docx ra PDF bằng LibreOffice để đếm trang, so ảnh, đọc dòng chữ ký. Runner Windows không có LibreOffice nên
    # các phần đó bị bỏ qua ở job build; job này chạy đủ, và --no-skip coi bộ nào còn phần bỏ qua (thiếu công cụ) là không đạt.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: { node-version: 22, cache: npm }
      - name: Cài LibreOffice, poppler, Python Pillow/numpy (so ảnh PDF), font Liberation (thay Times New Roman) và thư viện chạy Electron
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends libreoffice-writer-nogui poppler-utils python3-pil python3-numpy fonts-liberation fonts-liberation2 fonts-dejavu-core xvfb xauth libnss3 libgbm1 libasound2t64 libgtk-3-0t64 libxss1
          soffice --version
      - run: npm ci
      - run: npm run build:html
      - name: Bốn bộ e2e có kiểm tra PDF (số hợp đồng, in đè, BM-08, chữ ký)
        run: node scripts/e2e-all.js sohd inde bm08 chuky --no-skip --out reports/e2e-pdf
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        if: always()
        with:
          name: e2e-pdf-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/e2e-pdf
          if-no-files-found: warn
      - name: Ghi bảng kết quả vào trang tóm tắt của lượt chạy
        if: always()
        run: test -f reports/e2e-pdf/summary.md && cat reports/e2e-pdf/summary.md >> "$GITHUB_STEP_SUMMARY" || true
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build:html
      - name: Kiểm thử đơn vị
        run: npm test
      - name: Kiểm thử đầu-cuối (Electron)
        run: npm run test:e2e
      - name: Tải báo cáo kiểm thử đầu-cuối (tổng hợp từng bộ và nhật ký)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: e2e-report-${{ github.event.pull_request.head.sha || github.sha }}
          path: reports/e2e
          if-no-files-found: warn
      - name: Ghi bảng kết quả kiểm thử đầu-cuối vào trang tóm tắt của lượt chạy
        if: always()
        shell: pwsh
        run: if (Test-Path reports/e2e/summary.md) { Get-Content reports/e2e/summary.md -Raw | Add-Content $env:GITHUB_STEP_SUMMARY }
      - name: Đóng gói bộ cài
        run: npm run dist
      - name: Kiểm tra có file .exe và ghi thông tin bản dựng
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist -Filter '*Setup*.exe' -ErrorAction SilentlyContinue
          if (-not $exe) { throw 'Không có file bộ cài (*Setup*.exe) trong thư mục dist' }
          if ($exe.Length -lt 50MB) { throw "Bộ cài nhỏ bất thường: $($exe.Length) byte" }
          $hash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          "commit=$env:TESTED_SHA`nversion=$ver`nfile=$($exe.Name)`nsize=$($exe.Length)`nsha256=$hash" | Set-Content dist/BUILD_INFO.txt
          Get-Content dist/BUILD_INFO.txt
      - name: Cài bộ .exe và kiểm tra khói (cài, mở, ghi, đóng, mở lại)
        shell: pwsh
        run: |
          . ./scripts/ci-install.ps1
          $setup = (Get-ChildItem dist -Filter '*Setup*.exe').FullName
          $dir = Join-Path $env:RUNNER_TEMP 'HAKQN-installed'
          $ec = Install-Setup -Setup $setup -Dir $dir -Tag 'smoke'
          if ($ec -ne 0) { throw ("Cài đặt lỗi, mã thoát {0} (0x{1:X8}); chẩn đoán nằm ở artifact install-diagnostics" -f $ec, ([uint32]([int64]$ec -band 4294967295))) }
          $app = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $app) { throw 'Không thấy file chạy sau khi cài' }
          $lnk = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Recurse -Filter '*HAKQN*.lnk' -ErrorAction SilentlyContinue
          if (-not $lnk) { throw 'Không có lối tắt HAKQN trong Start Menu' }
          Write-Host "Lối tắt Start Menu: $($lnk.FullName)"
          $ud = Join-Path $env:RUNNER_TEMP 'hakqn-userdata'
          foreach ($ph in 'create', 'verify') {
            $out = Join-Path $env:RUNNER_TEMP "smoke-$ph.json"
            $env:HAKQN_USERDATA = $ud; $env:HAKQN_SMOKE = $out; $env:HAKQN_SMOKE_PHASE = $ph
            $pr = Start-Process -FilePath $app.FullName -PassThru
            if (-not $pr.WaitForExit(120000)) { $pr.Kill(); throw "Pha ${ph}: ứng dụng không tự thoát sau 120 giây" }
            if (-not (Test-Path $out)) { throw "Pha ${ph}: không có file kết quả (mã thoát $($pr.ExitCode))" }
            Get-Content $out -Raw
            if ($pr.ExitCode -ne 0) { throw "Pha ${ph}: kiểm tra khói thất bại (mã thoát $($pr.ExitCode))" }
          }
          Copy-Item (Join-Path $env:RUNNER_TEMP 'smoke-*.json') dist/
      - name: Đổi thư mục dữ liệu và sao lưu bằng bộ cài thật (sao chép, ghi đè có dự phòng, hoàn tác, đích đang dùng, ổ biến mất)
        shell: pwsh
        run: |
          $dir = Join-Path $env:RUNNER_TEMP 'HAKQN-installed'
          $app = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $app) { throw 'Không thấy file chạy sau khi cài' }
          $out = Join-Path $env:RUNNER_TEMP 'smoke-relocate.json'
          $env:HAKQN_USERDATA = Join-Path $env:RUNNER_TEMP 'hakqn-userdata-reloc'; $env:HAKQN_SMOKE = $out; $env:HAKQN_SMOKE_PHASE = 'relocate'; $env:HAKQN_SMOKE_DIR = $env:RUNNER_TEMP
          $pr = Start-Process -FilePath $app.FullName -PassThru
          if (-not $pr.WaitForExit(180000)) { $pr.Kill(); throw 'Pha relocate: ứng dụng không tự thoát sau 180 giây' }
          if (-not (Test-Path $out)) { throw "Pha relocate: không có file kết quả (mã thoát $($pr.ExitCode))" }
          Get-Content $out -Raw
          if ($pr.ExitCode -ne 0) { throw "Pha relocate: thất bại (mã thoát $($pr.ExitCode))" }
          Copy-Item $out dist/smoke-relocate.json
      - name: Nâng cấp từ bộ cài THẬT v1.0.0 (cài v1.0.0, mở, đặt dữ liệu cũ, cài đè bản mới, kiểm tra dữ liệu)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $old = Join-Path $env:RUNNER_TEMP 'old-release'; New-Item -ItemType Directory $old | Out-Null
          gh release download v1.0.0 --repo $env:GITHUB_REPOSITORY -p 'HAKQN-HoSoKhaiThac-Setup-1.0.0.exe' -D $old
          $oldSetup = Join-Path $old 'HAKQN-HoSoKhaiThac-Setup-1.0.0.exe'
          if (-not (Test-Path $oldSetup)) { Write-Host "::warning::Bản phát hành v1.0.0 không còn trên GitHub Releases (đã dọn) nên bỏ qua bước nâng cấp từ bộ cài thật của bản này. Kiểm thử nâng cấp bằng cơ sở dữ liệu mẫu trong bước kiểm thử đầu-cuối vẫn chạy."; exit 0 }
          $h = (Get-FileHash $oldSetup -Algorithm SHA256).Hash
          if ($h -ne '8AAE5F969F7A19A3591A0E91DC23D247846B4B329F23B6D791659758AB62C68D') { throw "Bộ cài v1.0.0 tải về không khớp mã băm công bố: $h" }
          $dir = Join-Path $env:RUNNER_TEMP 'HAKQN-upgrade'; $ud = Join-Path $env:RUNNER_TEMP 'hakqn-upgrade-userdata'
          . ./scripts/ci-install.ps1
          $ec = Install-Setup -Setup $oldSetup -Dir $dir -Tag 'upgrade-v100-old'
          if ($ec -ne 0) { throw "Cài v1.0.0 lỗi, mã thoát $ec" }
          $oldApp = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $oldApp) { throw 'Không thấy file chạy của v1.0.0 sau khi cài' }
          # chạy bản v1.0.0 thật để nó tự tạo cơ sở dữ liệu trong hồ sơ người dùng, rồi tắt
          $env:HAKQN_USERDATA = $ud
          $pr = Start-Process -FilePath $oldApp.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($pr.HasExited) { throw "v1.0.0 thoát sớm, mã $($pr.ExitCode)" }
          taskkill /PID $pr.Id /T /F | Out-Null
          Start-Sleep -Seconds 3
          $dbf = Join-Path $ud 'hakqn.sqlite'
          if (-not (Test-Path $dbf)) { throw "v1.0.0 không tạo cơ sở dữ liệu tại $dbf" }
          # thay bằng cơ sở dữ liệu giả lập do chính mã v1.0.0 tạo: một chủ ba lô, điểm đến nhập tay, cước theo bậc, phiếu 31/02/2026, bản tra cứu
          Remove-Item "$dbf-wal", "$dbf-shm" -Force -ErrorAction SilentlyContinue
          Copy-Item tests/fixtures/hakqn_v1_0_0.sqlite $dbf -Force
          # cài đè bản mới lên đúng thư mục đã cài v1.0.0
          $setup = (Get-ChildItem dist -Filter '*Setup*.exe').FullName
          $ec = Install-Setup -Setup $setup -Dir $dir -Tag 'upgrade-v100-new'
          if ($ec -ne 0) { throw "Cài đè bản mới lỗi, mã thoát $ec" }
          $newApp = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'smoke-upgrade.json'
          $env:HAKQN_SMOKE = $out; $env:HAKQN_SMOKE_PHASE = 'upgrade'
          $pr = Start-Process -FilePath $newApp.FullName -PassThru
          if (-not $pr.WaitForExit(120000)) { $pr.Kill(); throw 'Nâng cấp: ứng dụng không tự thoát sau 120 giây' }
          if (-not (Test-Path $out)) { throw "Nâng cấp: không có file kết quả (mã thoát $($pr.ExitCode))" }
          Get-Content $out -Raw
          if ($pr.ExitCode -ne 0) { throw "Nâng cấp: kiểm tra dữ liệu thất bại (mã thoát $($pr.ExitCode))" }
          Copy-Item $out dist/smoke-upgrade.json
      - name: Nâng cấp từ bộ cài THẬT v1.4.0 (một chủ hai lô A và B, điện thoại, số và ngày ký hợp đồng, địa chỉ giao, cước)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/ci-install.ps1
          $old = Join-Path $env:RUNNER_TEMP 'old-release-140'; New-Item -ItemType Directory $old | Out-Null
          gh release download v1.4.0 --repo $env:GITHUB_REPOSITORY -p 'HAKQN-HoSoKhaiThac-Setup-1.4.0.exe' -D $old
          $oldSetup = Join-Path $old 'HAKQN-HoSoKhaiThac-Setup-1.4.0.exe'
          if (-not (Test-Path $oldSetup)) { Write-Host "::warning::Bản phát hành v1.4.0 không còn trên GitHub Releases (đã dọn) nên bỏ qua bước nâng cấp từ bộ cài thật của bản này. Kiểm thử nâng cấp bằng cơ sở dữ liệu mẫu trong bước kiểm thử đầu-cuối vẫn chạy."; exit 0 }
          $h = (Get-FileHash $oldSetup -Algorithm SHA256).Hash
          if ($h -ne 'FA0B8FE1745FC46DF59EFF6B638BB2CE0DBF87D0D1FE32CC59C36E63E4160AC5') { throw "Bộ cài v1.4.0 tải về không khớp mã băm công bố: $h" }
          $dir = Join-Path $env:RUNNER_TEMP 'HAKQN-upgrade140'; $ud = Join-Path $env:RUNNER_TEMP 'hakqn-upgrade140-userdata'
          $ec = Install-Setup -Setup $oldSetup -Dir $dir -Tag 'upgrade-v140-old'
          if ($ec -ne 0) { throw "Cài v1.4.0 lỗi, mã thoát $ec" }
          $oldApp = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $oldApp) { throw 'Không thấy file chạy của v1.4.0 sau khi cài' }
          $env:HAKQN_USERDATA = $ud
          $pr = Start-Process -FilePath $oldApp.FullName -PassThru
          Start-Sleep -Seconds 15
          if ($pr.HasExited) { throw "v1.4.0 thoát sớm, mã $($pr.ExitCode)" }
          taskkill /PID $pr.Id /T /F | Out-Null
          Start-Sleep -Seconds 3
          $dbf = Join-Path $ud 'hakqn.sqlite'
          if (-not (Test-Path $dbf)) { throw "v1.4.0 không tạo cơ sở dữ liệu tại $dbf" }
          Remove-Item "$dbf-wal", "$dbf-shm" -Force -ErrorAction SilentlyContinue
          Copy-Item tests/fixtures/hakqn_v1_4.sqlite $dbf -Force
          $setup = (Get-ChildItem dist -Filter '*Setup*.exe').FullName
          $ec = Install-Setup -Setup $setup -Dir $dir -Tag 'upgrade-v140-new'
          if ($ec -ne 0) { throw "Cài đè bản mới lên v1.4.0 lỗi, mã thoát $ec" }
          $newApp = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'smoke-upgrade14.json'
          $env:HAKQN_SMOKE = $out; $env:HAKQN_SMOKE_PHASE = 'upgrade14'
          $pr = Start-Process -FilePath $newApp.FullName -PassThru
          if (-not $pr.WaitForExit(120000)) { $pr.Kill(); throw 'Nâng cấp 1.4.0: ứng dụng không tự thoát sau 120 giây' }
          if (-not (Test-Path $out)) { throw "Nâng cấp 1.4.0: không có file kết quả (mã thoát $($pr.ExitCode))" }
          Get-Content $out -Raw
          if ($pr.ExitCode -ne 0) { throw "Nâng cấp 1.4.0: kiểm tra dữ liệu thất bại (mã thoát $($pr.ExitCode))" }
          Copy-Item $out dist/smoke-upgrade14.json
      - name: Nâng cấp từ bộ cài THẬT v1.4.33 (bản phát hành gần nhất, Electron 33) — dữ liệu do chính bản cũ tạo, cài đè bản mới, kiểm tra dữ liệu và giao diện
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          . ./scripts/ci-install.ps1
          $old = Join-Path $env:RUNNER_TEMP 'old-release-1433'; New-Item -ItemType Directory $old | Out-Null
          gh release download v1.4.33 --repo $env:GITHUB_REPOSITORY -p 'HAKQN-HoSoKhaiThac-Setup-1.4.33.exe' -D $old
          $oldSetup = Join-Path $old 'HAKQN-HoSoKhaiThac-Setup-1.4.33.exe'
          if (-not (Test-Path $oldSetup)) { Write-Host "::warning::Bản phát hành v1.4.33 không còn trên GitHub Releases nên bỏ qua bước nâng cấp từ bộ cài thật của bản này. Hãy cập nhật bước này sang bản phát hành gần nhất còn trên Releases."; exit 0 }
          $h = (Get-FileHash $oldSetup -Algorithm SHA256).Hash
          if ($h -ne '15DC58545276FED4C0CE8565B36D9D6856010E4E066E8AAEE91078DA2F68E6AD') { throw "Bộ cài v1.4.33 tải về không khớp mã băm công bố: $h" }
          $dir = Join-Path $env:RUNNER_TEMP 'HAKQN-upgrade1433'; $ud = Join-Path $env:RUNNER_TEMP 'hakqn-upgrade1433-userdata'
          $ec = Install-Setup -Setup $oldSetup -Dir $dir -Tag 'upgrade-v1433-old'
          if ($ec -ne 0) { throw "Cài v1.4.33 lỗi, mã thoát $ec" }
          $oldApp = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          if (-not $oldApp) { throw 'Không thấy file chạy của v1.4.33 sau khi cài' }
          # chính bản v1.4.33 đã cài ghi dữ liệu (kiểm tra khói pha create của bản đó: 1 chủ rừng, 2 lô, phiếu cân) rồi tự thoát
          $env:HAKQN_USERDATA = $ud; $env:HAKQN_SMOKE = Join-Path $env:RUNNER_TEMP 'smoke-v1433-old.json'; $env:HAKQN_SMOKE_PHASE = 'create'
          $pr = Start-Process -FilePath $oldApp.FullName -PassThru
          if (-not $pr.WaitForExit(120000)) { $pr.Kill(); throw 'v1.4.33: ứng dụng không tự thoát sau 120 giây' }
          Get-Content $env:HAKQN_SMOKE -Raw
          if ($pr.ExitCode -ne 0) { throw "v1.4.33 không tạo được dữ liệu thử (mã thoát $($pr.ExitCode))" }
          $oldRes = Get-Content $env:HAKQN_SMOKE -Raw | ConvertFrom-Json
          if ($oldRes.version -ne '1.4.33') { throw "Bản cũ chạy không đúng phiên bản: $($oldRes.version)" }
          # cài đè bản mới lên đúng thư mục đã cài v1.4.33
          $setup = (Get-ChildItem dist -Filter '*Setup*.exe').FullName
          $ec = Install-Setup -Setup $setup -Dir $dir -Tag 'upgrade-v1433-new'
          if ($ec -ne 0) { throw "Cài đè bản mới lên v1.4.33 lỗi, mã thoát $ec" }
          $newApp = Get-ChildItem $dir -Filter '*.exe' | Where-Object { $_.Name -notmatch 'Uninstall' } | Select-Object -First 1
          $out = Join-Path $env:RUNNER_TEMP 'smoke-upgrade1433.json'
          $env:HAKQN_SMOKE = $out; $env:HAKQN_SMOKE_PHASE = 'verify'
          $pr = Start-Process -FilePath $newApp.FullName -PassThru
          if (-not $pr.WaitForExit(120000)) { $pr.Kill(); throw 'Nâng cấp 1.4.33: ứng dụng không tự thoát sau 120 giây' }
          if (-not (Test-Path $out)) { throw "Nâng cấp 1.4.33: không có file kết quả (mã thoát $($pr.ExitCode))" }
          Get-Content $out -Raw
          if ($pr.ExitCode -ne 0) { throw "Nâng cấp 1.4.33: kiểm tra dữ liệu thất bại (mã thoát $($pr.ExitCode))" }
          $r = Get-Content $out -Raw | ConvertFrom-Json
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($r.version -ne $ver) { throw "Sau khi cài đè vẫn chạy phiên bản $($r.version), mong đợi $ver" }
          # bản mới tự sao lưu hằng ngày ngay lần mở đầu sau nâng cấp (dữ liệu đã có hồ sơ)
          $bk = Join-Path $ud 'backups'
          $auto = Get-ChildItem $bk -Filter 'tu-dong-*.sqlite' -ErrorAction SilentlyContinue
          if (-not $auto) { throw "Sau nâng cấp không có bản tự sao lưu hằng ngày trong $bk" }
          Write-Host "Bản tự sao lưu: $($auto.Name -join ', ')"
          Copy-Item $out dist/smoke-upgrade1433.json
      - name: Thu thập chẩn đoán cài đặt (chỉ khi một bước ở trên thất bại)
        if: failure()
        shell: pwsh
        run: ./scripts/ci-collect-diag.ps1
      - name: Tải chẩn đoán cài đặt lên artifact (mã thoát, phiên bản, commit, nhật ký sự cố Windows)
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: install-diagnostics-${{ github.event.pull_request.head.sha || github.sha }}-run${{ github.run_id }}
          path: diag/
          if-no-files-found: warn
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: HAKQN-Setup-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/*Setup*.exe
            dist/BUILD_INFO.txt
            dist/smoke-*.json
          if-no-files-found: error
      - name: Tạo bản phát hành (Release) kèm bộ cài
        if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.inputs.release_tag || github.ref_name }}
        run: |
          $exe = (Get-ChildItem dist -Filter '*Setup*.exe').FullName
          $notes = "Bản dựng từ commit $env:TESTED_SHA`n`n" + (Get-Content dist/BUILD_INFO.txt -Raw) + "`nChưa ký số: Windows có thể hiện cảnh báo SmartScreen, chọn More info → Run anyway."
          gh release create $env:TAG $exe dist/BUILD_INFO.txt --target $env:TESTED_SHA --title "HAKQN Desktop $env:TAG" --notes $notes
