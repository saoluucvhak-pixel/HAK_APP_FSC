 if(!d)return `<div class="res"><div class="alert err"><b>Không tìm thấy hợp đồng ${F.hd}</b> trên Google Sheets (đã đồng bộ lúc 14:05). Kiểm tra lại mã hợp đồng, hoặc bấm "Tải lại từ Sheet" ở màn Dữ liệu Google Sheets.</div></div>`;
 if(d.st==='err')return `<div class="res"><div class="alert err"><b>Hợp đồng ${d.hd} có lỗi dữ liệu trên Sheet:</b> ${d.msg[0].split('|')[1]}</div></div>`;
 const rows=[['Họ và tên',F.ten,d.ten,fold(F.ten)===fold(d.ten)],['CCCD',F.cccd,d.cccd,F.cccd.replace(/\s/g,'')===d.cccd],['Ngày ký hợp đồng',F.ngay,d.ngay,F.ngay===d.ngay]];
 const sheetTan=d.pc.filter(p=>p[4]!=='bad').reduce((t,p)=>t+p[3],0);
 const at=F.tan==null?sheetTan:F.tan;rows.push(['Số rừng',String(F.rung)+' (trong hồ sơ)',String(d.rungs.length)+' (trên Sheet)',F.rung===d.rungs.length]);
 rows.push(['Tổng tấn phiếu cân',f2(at)+' t (trong hồ sơ)',f2(sheetTan)+' t',Math.abs(at-sheetTan)<0.005]);
 const bad=rows.filter(r=>!r[3]).length;
 return `<div class="res"><div class="alert ${bad?'warn':''}" style="${bad?'':'background:var(--okBg);border-color:var(--ok)'}">${bad?`<b>Cảnh báo: ${bad} chênh lệch</b> giữa dữ liệu nhập tay và Google Sheets.`:'<b>Khớp:</b> thông tin nhập tay trùng Google Sheets.'}</div><div class="tbwrap"><table><tr><th>Mục</th><th>Đã nhập / trong hồ sơ</th><th>Trên Google Sheets</th><th>Kết luận</th></tr>${rows.map(r=>`<tr class="${r[3]?'':'diff'}"><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]?'<span class="k-ok">Khớp</span>':'<span class="k-bad">Chênh lệch</span>'}</td></tr>`).join('')}</table></div><div class="acts" style="padding:8px 0 0"><button class="btn sm" id="open2">Mở hợp đồng ${d.hd} để xem và cập nhật</button><span class="m" style="color:var(--mut);font-size:12.5px">Không tự sửa dữ liệu nhập tay; người dùng quyết định.</span></div></div>`}
// ===== Màn 2
let flt='all',qs='',cur=0,rg=0,tab='ho',showSame=false,pcf='all',page=0,msgSum='';const PAGE=5;
function scr2(){const L=D.map((d,i)=>[d,i]).filter(([d])=>(flt==='all'||d.st===flt)&&(!qs||fold(d.hd+' '+d.ten+' '+d.cccd).includes(fold(qs))));
 $('#scr2').innerHTML=`<div class="crumb">Trang chủ › Dữ liệu Google Sheets</div><h1>Dữ liệu Google Sheets</h1><p class="sub">Toàn bộ hợp đồng trên Sheet. Bấm một hợp đồng để xem hồ sơ rừng, tọa độ và phiếu cân của hợp đồng đó.</p>
 <div class="bar2"><input type="search" id="q" value="${qs}" placeholder="Tìm mã hợp đồng, chủ rừng, CCCD (không phân biệt dấu)…"><span class="chip ${flt==='all'?'on':''}" data-f="all">Tất cả</span><span class="chip ${flt==='ok'?'on':''}" data-f="ok">Đủ</span><span class="chip ${flt==='warn'?'on':''}" data-f="warn">Cần xem</span><span class="chip ${flt==='err'?'on':''}" data-f="err">Lỗi dữ liệu</span><span class="sync">Đồng bộ: 22/11/2026 14:05 · 3/3 tab hợp lệ</span><button class="btn sec" type="button">Tải lại từ Sheet</button></div>
 <div class="mwrap"><div class="panel"><h2>Hợp đồng (${L.length}/${D.length})</h2><div class="tbwrap"><table class="ctab"><tr><th>Mã hợp đồng</th><th>Chủ rừng</th><th>CCCD</th><th>Ngày ký</th><th class="num">Rừng</th><th class="num">Phiếu</th><th class="num">Tổng tấn</th><th>Trạng thái</th></tr>${L.length?L.map(([d,i])=>`<tr class="row" data-i="${i}" tabindex="0"><td><b>${d.hd}</b></td><td>${d.ten}</td><td>${d.cccd}</td><td>${d.ngay}</td><td class="num">${d.rungs.length}</td><td class="num">${d.pc.length}</td><td class="num">${f2(d.pc.reduce((t,p)=>t+p[3],0))}</td><td><span class="st ${d.st}">${d.stt}</span></td></tr>`).join(''):'<tr><td colspan="8" class="empty">Không có hợp đồng khớp bộ lọc.</td></tr>'}</table></div></div></div>`}
function tg(p){return {new:'<span class="tg new">Mới</span>',chg:'<span class="tg chg">Đổi</span>',dup:'<span class="tg dup">Trùng — bỏ qua</span>',bad:'<span class="tg bad">Lệch CCCD</span>',dsn:'<span class="tg chg">Nghi đổi số</span>',sn:'<span class="tg chg">Đổi số</span>'}[p[4]]}
function modal(){const d=D[cur];let h=`<div class="mh"><div><div class="t" id="mt">${d.hd} · ${d.ten}</div><div class="m">CCCD ${d.cccd} · ký ${d.ngay} · ${d.rungs.length} rừng · ${d.pc.length} phiếu cân</div></div><span style="display:flex;gap:8px;align-items:center"><span class="st ${d.st}">${d.stt}</span><button class="x" id="cls">Đóng ✕</button></span></div>`;
 if(!d.rungs.length){$('#md').innerHTML=h+`<div class="dtb">${d.msg.map(m=>`<div class="alert ${m.split('|')[0]}">${m.split('|')[1]}</div>`).join('')}<div class="empty">Không có dữ liệu để cập nhật.</div></div>`;return}
 if(rg>=d.rungs.length)rg=0;const R=d.rungs[rg];
 h+=`<div class="mb"><div class="master"><h3>Rừng của hợp đồng (${d.rungs.length}) — thứ tự nhập</h3>`+d.rungs.map((r,i)=>{const u=used(d,i),p=Math.min(100,u/r.cap*100),c=u>r.cap*(1+d.tol/100)+1e-9?'over':p>=90?'near':'';return `<button class="rc ${i===rg?'on':''}" data-r="${i}"><b>Rừng ${i+1}: ${r.ma}<span class="bdg">${pend(d,i)}</span></b><span class="s">${r.lo}</span><div class="meter"><i class="${c}" style="width:${p}%"></i></div><span class="s">${f2(u)} / ${f2(r.cap)} t dự kiến${c==='over'?' · <b style="color:var(--err)">vượt</b>':''}</span></button>`}).join('')+`</div>`;
 h+=`<div class="dt"><div class="dtt" role="tablist"><button class="${tab==='ho'?'on':''}" data-t="ho">Hồ sơ rừng</button><button class="${tab==='gps'?'on':''}" data-t="gps">Tọa độ (${R.gps.length})</button><button class="${tab==='pc'?'on':''}" data-t="pc">Phiếu cân (${d.pc.length})</button></div><div class="dtb">`;
 d.msg.forEach(m=>{h+=`<div class="alert ${m.split('|')[0]}">${m.split('|')[1]}</div>`});
 if(tab==='ho'){const same=R.info.filter(x=>x[3]===0).length;h+=`<div class="bh" style="border:1px solid var(--line);border-radius:8px 8px 0 0"><b>Hồ sơ rừng ${R.ma}</b><label><input type="checkbox" data-on="0" ${R.on[0]?'checked':''}> Cập nhật khối này</label></div><div class="hid" style="border:1px solid var(--line);border-top:0">${same} trường giống nhau ${showSame?'đang hiện':'đang ẩn'} · <button id="tsame">${showSame?'Ẩn':'Hiện'}</button> · Dự kiến = ${String(R.ha).replace('.',',')} ha × ${R.dm} = <b>${f2(R.cap)} t</b> · Vào lô: <select><option>${R.lo}</option><option>＋ Tạo lô mới</option></select></div><div class="tbwrap ${R.on[0]?'':'off'}"><table><tr><th></th><th>Trường</th><th>Trong hồ sơ</th><th>Trên Sheet</th><th>Trạng thái</th></tr>`;
  R.info.map((x,i)=>[x,i]).filter(([x])=>showSame||x[3]!==0).forEach(([x,i])=>{h+=`<tr class="${x[3]===1?'diff':''}"><td><input type="checkbox" data-si="${i}" ${R.si[i]?'checked':''} ${x[3]===0?'disabled':''}></td><td>${x[0]}</td><td class="${x[1]?'':'same'}">${x[1]||'(trống)'}</td><td>${x[2]}</td><td>${x[3]===0?'<span class="same">Giống nhau</span>':x[3]===1?'<span class="tg chg">Khác — chọn nếu muốn đổi</span>':'<span class="tg new">Điền vào ô trống</span>'}</td></tr>`});h+=`</table></div>`}
 if(tab==='gps'){h+=`<div class="bh" style="border:1px solid var(--line);border-radius:8px 8px 0 0"><b>Tọa độ rừng ${R.ma}</b><label><input type="checkbox" data-on="1" ${R.on[1]?'checked':''}> Cập nhật khối này</label></div><div class="tbwrap ${R.on[1]?'':'off'}"><table><tr><th></th><th class="num">Điểm</th><th class="num">Vĩ độ</th><th class="num">Kinh độ</th><th>Kiểm tra</th></tr>`;R.gps.forEach((g,i)=>{h+=`<tr><td><input type="checkbox" data-sg="${i}" ${R.sg[i]?'checked':''}></td><td class="num">${g[0]}</td><td class="num">${g[1]}</td><td class="num">${g[2]}</td><td>${g[3]==='ok'?'<span class="same">Trong miền hợp lệ</span>':'<span class="tg chg">Gần ranh miền — kiểm tra lại</span>'}</td></tr>`});h+=`</table></div>`}
 if(tab==='pc'){const multi=d.rungs.length>1,un=d.pc.filter((p,i)=>d.as[i]===-1&&p[4]==='new').length,sus=d.pc.map((p,i)=>[p,i]).filter(([p])=>p[4]==='dsn');
  h+=`<div class="bh" style="border:1px solid var(--line);border-radius:8px 8px 0 0"><b>Phiếu cân của hợp đồng (HoSoKeo)</b><label><input type="checkbox" data-on="2" ${R.on[2]?'checked':''}> Cập nhật khối này</label></div><div class="rule" style="border:1px solid var(--line);border-top:0">${multi?'<b>Phân bổ:</b> theo ngày cân; rừng nhập trước đến hết sản lượng dự kiến (+ dung sai), phần còn lại sang rừng sau; rừng cuối nhận phần dư.':'<b>Hợp đồng 1 rừng:</b> mọi phiếu mặc định vào rừng này.'}</div>`;
  sus.forEach(([p,i])=>{h+=`<div class="sus"><b>Nghi đổi số phiếu:</b> trên Sheet là <code>${p[0]}</code>, hồ sơ đã có <code>${p[5]}</code> — cùng ngày ${p[1]}, BKS ${p[2]}, ${f2(p[3])} t.<div class="p"><button class="btn sm" data-sn="${i}">Đổi số ${p[5]} → ${p[0]} (giữ nguyên phiếu)</button><button class="btn sm sec" data-sk="${i}">Là chuyến khác (thêm mới)</button><span class="m" style="color:var(--mut);font-size:12px">Mặc định: không ghi cho đến khi chọn.</span></div></div>`});
  h+=`<div class="tools">${multi?`<button class="btn sm" id="aauto">Phân bổ tự động</button><button class="btn sm sec" id="aone">Phân bổ phiếu còn lại vào rừng ${rg+1}</button><button class="btn sm sec" id="aclr">Xóa phân bổ</button><label>Dung sai <input type="number" id="tol" value="${d.tol}" min="0" max="30" style="width:56px"> %</label>`:''}<span style="margin-left:auto"></span><label>Lọc <select id="pcf"><option value="all">Tất cả</option><option value="new">Mới</option><option value="chg">Đổi</option><option value="dsn">Nghi đổi số</option><option value="bad">Lệch CCCD</option></select></label></div>`;
  if(un)h+=`<div class="alert warn" style="margin:8px 0">Còn <b>${un}</b> phiếu chưa phân bổ vào rừng nào — chưa được cập nhật.</div>`;
  const idx=d.pc.map((p,i)=>i).filter(i=>pcf==='all'||d.pc[i][4]===pcf),pages=Math.max(1,Math.ceil(idx.length/PAGE));if(page>=pages)page=0;
  h+=`<div class="tbwrap ${R.on[2]?'':'off'}"><table><tr><th></th><th>Số phiếu</th><th>Ngày cân</th><th>BKS</th><th class="num">KL (tấn)</th><th>Trạng thái</th><th>Vào rừng</th></tr>`;
  idx.slice(page*PAGE,page*PAGE+PAGE).forEach(i=>{const p=d.pc[i],lock=p[4]==='dup'||p[4]==='dsn'||p[4]==='bad';h+=`<tr class="${p[4]==='dup'?'off':''}"><td><input type="checkbox" data-sp="${i}" ${d.sp[i]?'checked':''} ${lock?'disabled':''}></td><td>${p[0]}${p[4]==='sn'?` <span class="same">(trước: ${p[5]})</span>`:''}</td><td>${p[1]}</td><td>${p[2]}</td><td class="num">${f2(p[3])}</td><td>${tg(p)}</td><td>${p[4]==='dsn'||p[4]==='dup'||p[4]==='sn'||p[4]==='bad'?'<span class="same">'+(p[4]==='sn'?'giữ lô hiện có':p[4]==='dsn'?'chờ quyết định':p[4]==='bad'?'không phân bổ':'đã có trong hồ sơ')+'</span>':`<select data-as="${i}" ${multi?'':'disabled'}>${d.rungs.map((r,k)=>`<option value="${k}" ${d.as[i]===k?'selected':''}>Rừng ${k+1}</option>`).join('')}<option value="-1" ${d.as[i]===-1?'selected':''}>Chưa phân bổ</option></select>`}</td></tr>`});
  h+=`</table></div><div class="pg"><span>${idx.length} phiếu · trang ${page+1}/${pages}</span><button class="btn sm sec" id="pp" ${page?'':'disabled'}>‹</button><button class="btn sm sec" id="pn" ${page<pages-1?'':'disabled'}>›</button></div>`}
 h+=`<div class="sum" id="sum" style="display:${msgSum?'block':'none'}">${msgSum}</div></div></div></div>`;
 const tot=d.rungs.map((r,i)=>`R${i+1}: ${r.si.filter(x=>x).length} trường · ${r.sg.filter(x=>x).length} điểm · ${d.pc.filter((p,j)=>d.as[j]===i&&d.sp[j]).length} phiếu`).join(' | ');
 h+=`<div class="mf"><span class="m" style="font-size:12.5px;color:var(--mut)">${tot}</span><span><button class="btn sec" id="qall">Chọn phần mới</button> <button class="btn sec" id="cls2">Đóng</button> <button class="btn" id="apply">Cập nhật vào hồ sơ</button></span></div>`;
 $('#md').innerHTML=h;const f=$('#pcf');if(f)f.value=pcf}
function openM(i){cur=i;rg=0;tab='ho';page=0;msgSum='';$('#ov').classList.add('on');modal();setS(2)}
function setS(n){$('#scr1').style.display=n===1?'':'none';$('#scr2').style.display=n===2?'':'none';document.querySelectorAll('.scr button').forEach(b=>b.classList.toggle('on',+b.dataset.s===n))}
document.addEventListener('click',e=>{const t=e.target,d=D[cur];
 if(t.dataset.s){setS(+t.dataset.s);$('#ov').classList.remove('on')}
 else if(t.id==='open'){const x=D.findIndex(c=>c.hd.toLowerCase()===F.hd.trim().toLowerCase());setS(2);qs=F.hd;scr2();if(x>=0)openM(x)}
 else if(t.id==='open2'){const x=D.findIndex(c=>c.hd.toLowerCase()===F.hd.trim().toLowerCase());qs=F.hd;setS(2);scr2();openM(x)}
 else if(t.id==='cmp'){cmp=compare();scr1()}
 else if(t.closest('tr.row')){openM(+t.closest('tr.row').dataset.i)}
 else if(t.id==='cls'||t.id==='cls2'){$('#ov').classList.remove('on')}
 else if(t.dataset.f&&t.classList.contains('chip')){flt=t.dataset.f;scr2()}
 else if(t.closest('.rc')){rg=+t.closest('.rc').dataset.r;modal()}
 else if(t.dataset.t){tab=t.dataset.t;modal()}
 else if(t.id==='tsame'){showSame=!showSame;modal()}
 else if(t.id==='aauto'){auto(d);modal()}else if(t.id==='aone'){fillOne(d,rg);modal()}else if(t.id==='aclr'){d.as=d.pc.map(()=>-1);modal()}
 else if(t.id==='pp'){page--;modal()}else if(t.id==='pn'){page++;modal()}
 else if(t.dataset.sn!==undefined){const i=+t.dataset.sn;d.pc[i][4]='sn';d.sp[i]=true;modal()}
 else if(t.dataset.sk!==undefined){const i=+t.dataset.sk;d.pc[i][4]='new';d.sp[i]=true;auto(d);modal()}
 else if(t.id==='qall'){d.rungs.forEach(r=>{r.si=r.info.map(x=>x[3]===2);r.sg=r.gps.map(g=>g[3]==='ok');r.on=[true,true,true]});d.sp=d.pc.map(p=>p[4]==='new'||p[4]==='sn');modal()}
 else if(t.id==='apply'){const s=d.rungs.map((r,i)=>`Rừng ${i+1} (${r.lo}): ${r.on[0]?r.si.filter(x=>x).length:0} trường · ${r.on[1]?r.sg.filter(x=>x).length:0} điểm · ${r.on[2]?d.pc.filter((p,j)=>d.as[j]===i&&d.sp[j]).length:0} phiếu`).join('<br>');const sn=d.pc.filter(p=>p[4]==='sn').map(p=>`${p[5]} → ${p[0]}`).join(', ');msgSum=`<b>Đã cập nhật (mô phỏng — chưa ghi dữ liệu thật):</b><br>${s}${sn?`<br>Đổi số phiếu (ghi nhật ký): ${sn}`:''}<br>Bỏ qua: phiếu trùng, dòng không tích, phiếu chưa phân bổ hoặc chờ quyết định.`;modal();const x=$('#sum');if(x)x.scrollIntoView({block:'nearest'})}
});
document.addEventListener('change',e=>{const t=e.target,d=D[cur],R=d.rungs[rg];
 if(t.id==='smp'){smpSel=t.value;Object.assign(F,SAMPLE[t.value]);cmp=null;scr1();return}
 if(t.dataset.f&&t.tagName==='INPUT'&&t.closest('.form')){F[t.dataset.f]=t.value;cmp=null;scr1();return}
 if(!R)return;if(t.dataset.on!==undefined)R.on[+t.dataset.on]=t.checked;else if(t.dataset.si!==undefined)R.si[+t.dataset.si]=t.checked;else if(t.dataset.sg!==undefined)R.sg[+t.dataset.sg]=t.checked;else if(t.dataset.sp!==undefined)d.sp[+t.dataset.sp]=t.checked;else if(t.dataset.as!==undefined)d.as[+t.dataset.as]=+t.value;else if(t.id==='tol'){d.tol=Math.max(0,+t.value||0);auto(d)}else if(t.id==='pcf'){pcf=t.value;page=0}else return;modal()});
document.addEventListener('input',e=>{if(e.target.id==='q'){qs=e.target.value;const p=e.target.selectionStart;scr2();const q=$('#q');q.focus();q.setSelectionRange(p,p)}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#ov').classList.remove('on');if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('row'))openM(+e.target.dataset.i)});
scr1();scr2();
</script></body></html>
